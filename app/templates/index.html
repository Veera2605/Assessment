<!DOCTYPE html>
<html>
<head>
    <title>Student Score Prediction</title>
</head>
<body>
    <h2>Enter Student Details</h2>
    <form method="POST" action="/predict">
        Study Hours: <input type="number" step="0.1" name="study_hours"><br>
        Attendance (%): <input type="number" name="attendance"><br>
        Assignments Completed: <input type="number" name="assignments_completed"><br>
        <input type="submit" value="Predict">
    </form>
    <h3>{{ prediction_text }}</h3>
</body>
</html>
